name: Generate SDE Database

on:
  workflow_dispatch:
    inputs:
      ru_descriptions:
        description: 'Fetch Russian descriptions from ESI (adds ~30 min)'
        required: false
        default: 'true'
        type: boolean
      build_icons:
        description: 'Generate type icons from EVE game cache'
        required: false
        default: 'true'
        type: boolean
  schedule:
    - cron: '0 6 * * 1'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get install -y libyaml-dev

      - name: Install dependencies
        run: pip install pyyaml requests Pillow numpy

      - name: Get week number for cache key
        id: date
        run: echo "week=$(date +%Y-%W)" >> $GITHUB_OUTPUT

      - name: Cache SDE download
        uses: actions/cache@v4
        id: sde-cache
        with:
          path: /tmp/sde.zip
          key: sde-${{ steps.date.outputs.week }}

      - name: Download SDE
        if: steps.sde-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o /tmp/sde.zip \
            https://developers.eveonline.com/static-data/eve-online-static-data-latest-yaml.zip

      - name: Probe CCP build & determine patch
        id: sde_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD=$(curl -fsSL "https://esi.evetech.net/latest/status/" | python3 -c "import sys, json; print(json.load(sys.stdin).get('server_version', 0))")
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "Probed CCP build: $BUILD"
          # Count prior releases on this build. patch = max(existing) + 1.
          # Tag schemes recognised: "sde-<build>" (legacy, patch=0) and "sde-<build>-p<patch>".
          PATCH=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" \
            | python3 -c "
          import sys, json, re
          d = json.load(sys.stdin)
          build = '$BUILD'
          patches = []
          for r in d:
              t = r.get('tag_name', '')
              if t == f'sde-{build}':
                  patches.append(0)
              m = re.match(rf'^sde-{build}-p(\d+)$', t)
              if m:
                  patches.append(int(m.group(1)))
          print(max(patches) + 1 if patches else 0)
          ")
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          if [ "$PATCH" = "0" ]; then
            echo "tag=sde-$BUILD" >> $GITHUB_OUTPUT
          else
            echo "tag=sde-$BUILD-p$PATCH" >> $GITHUB_OUTPUT
          fi
          echo "Patch: $PATCH"

      - name: Generate SQLite database
        run: |
          RU_FLAG=""
          if [ "${{ inputs.ru_descriptions }}" = "true" ]; then
            RU_FLAG="--ru-descriptions"
          fi
          python3 generate_sde.py \
            --sde-zip /tmp/sde.zip \
            --out item_db_en.sqlite \
            --patch ${{ steps.sde_version.outputs.patch }} \
            $RU_FLAG \
            --workers 20

      - name: Cache EVE game files
        if: inputs.build_icons != 'false'
        uses: actions/cache@v4
        with:
          path: icon_cache
          key: eve-cache-${{ steps.date.outputs.week }}
          restore-keys: |
            eve-cache-

      - name: Cache icon working directory
        if: inputs.build_icons != 'false'
        uses: actions/cache@v4
        with:
          path: icon_work
          key: icon-work-${{ steps.date.outputs.week }}
          restore-keys: |
            icon-work-

      - name: Generate type icons
        if: inputs.build_icons != 'false'
        run: |
          python3 build_icons.py \
            --out icons.zip \
            --cache-dir icon_cache \
            --icon-dir icon_work \
            --skip-skins

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.sde_version.outputs.tag }}
          name: SDE ${{ steps.sde_version.outputs.build }}${{ steps.sde_version.outputs.patch != '0' && format(' patch {0}', steps.sde_version.outputs.patch) || '' }}
          body: |
            EVE SDE database build ${{ steps.sde_version.outputs.build }}, patch ${{ steps.sde_version.outputs.patch }}

            Generated from CCP Static Data Export on ${{ github.run_id }}.
            Apps compare (build, patch) — an update notification fires when either advances.
          files: |
            item_db_en.zip
            icons.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
